<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Logo Flor de Lótus Dourada Ornamentada</title>
  <defs>
    <!-- Gradientes Dourados Metálicos -->
    <linearGradient id="goldLeafLight" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFF7C8" />
      <stop offset="28%" stop-color="#F6CE66" />
      <stop offset="68%" stop-color="#C88729" />
      <stop offset="100%" stop-color="#7D4C0E" />
    </linearGradient>

    <linearGradient id="goldLeafCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE0" />
      <stop offset="32%" stop-color="#F7D36E" />
      <stop offset="72%" stop-color="#C78527" />
      <stop offset="100%" stop-color="#754409" />
    </linearGradient>

    <linearGradient id="goldLeafDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBC058" />
      <stop offset="50%" stop-color="#B07019" />
      <stop offset="100%" stop-color="#663A06" />
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE2" />
      <stop offset="45%" stop-color="#E5AA44" />
      <stop offset="100%" stop-color="#6B3D08" />
    </linearGradient>

    <!-- Gradiente das Pedras Preciosas: Rubi -->
    <radialGradient id="rubyGem" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF9AA2" />
      <stop offset="30%" stop-color="#E11D48" />
      <stop offset="75%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </radialGradient>

    <!-- Gradiente das Pedras Preciosas: Safira -->
    <radialGradient id="sapphireGem" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="30%" stop-color="#1D4ED8" />
      <stop offset="75%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Brilho suave atrás da flor -->
    <radialGradient id="softHalo" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#F6CE66" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#F6CE66" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#F6CE66" stop-opacity="0" />
    </radialGradient>

    <!-- Sombra suave para profundidade 3D -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4A2B05" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Halo dourado sutil -->
  <circle cx="400" cy="255" r="270" fill="url(#softHalo)" />

  <g filter="url(#dropShadow)">
    <!-- ==================== CORRENTES DELICADAS (ELOS) ==================== -->
    <g fill="none" stroke="url(#goldRim)" stroke-width="2.2" stroke-dasharray="1 4.2" stroke-linecap="round">
      <!-- Correntes externas longas -->
      <path d="M 172 342 C 195 455, 295 485, 392 435" />
      <path d="M 628 342 C 605 455, 505 485, 408 435" />
      <!-- Correntes médias entrelaçadas -->
      <path d="M 225 385 C 265 470, 345 485, 396 445" />
      <path d="M 575 385 C 535 470, 455 485, 404 445" />
      <!-- Correntes internas curtas -->
      <path d="M 295 405 C 325 455, 365 465, 396 445" />
      <path d="M 505 405 C 475 455, 435 465, 404 445" />
    </g>

    <!-- ==================== FILIGRANA E ESPIRAIS INFERIORES ==================== -->
    <g fill="none" stroke="url(#goldRim)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <!-- Espirais maiores laterais -->
      <path d="M 388 395 C 335 390, 275 425, 240 412 C 218 404, 215 380, 232 376 C 244 373, 250 384, 242 392" />
      <path d="M 412 395 C 465 390, 525 425, 560 412 C 582 404, 585 380, 568 376 C 556 373, 550 384, 558 392" />

      <!-- Espirais internas em coração ao redor do rubi central -->
      <path d="M 392 405 C 365 392, 330 405, 335 428 C 338 442, 355 442, 357 430 C 358 422, 350 418, 346 423" />
      <path d="M 408 405 C 435 392, 470 405, 465 428 C 462 442, 445 442, 443 430 C 442 422, 450 418, 454 423" />

      <!-- Arcos de ligação ao pingente -->
      <path d="M 352 438 C 370 452, 388 455, 400 468" />
      <path d="M 448 438 C 430 452, 412 455, 400 468" />
    </g>

    <!-- ==================== PÉTALAS DA FLOR DE LÓTUS ==================== -->
    <g stroke="url(#goldRim)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
      
      <!-- Camada 1: Pétala superior traseira -->
      <path d="M 400 24 C 345 95, 322 180, 400 358 C 478 180, 455 95, 400 24 Z" fill="url(#goldLeafDeep)" />

      <!-- Camada 2: Pétalas médias superiores -->
      <path d="M 218 76 C 202 172, 232 288, 396 364 C 336 245, 300 142, 218 76 Z" fill="url(#goldLeafLight)" />
      <path d="M 218 76 C 258 175, 308 268, 396 364" fill="none" stroke="#FFF6C2" stroke-width="1.2" opacity="0.7" />

      <path d="M 582 76 C 598 172, 568 288, 404 364 C 464 245, 500 142, 582 76 Z" fill="url(#goldLeafLight)" />
      <path d="M 582 76 C 542 175, 492 268, 404 364" fill="none" stroke="#FFF6C2" stroke-width="1.2" opacity="0.7" />

      <!-- Camada 3: Pétalas laterais abertas -->
      <path d="M 110 176 C 150 252, 224 332, 394 366 C 308 292, 230 192, 110 176 Z" fill="url(#goldLeafDeep)" />
      <path d="M 110 176 C 192 232, 285 302, 394 366" fill="none" stroke="#FFF6C2" stroke-width="1.3" opacity="0.75" />

      <path d="M 690 176 C 650 252, 576 332, 406 366 C 492 292, 570 192, 690 176 Z" fill="url(#goldLeafDeep)" />
      <path d="M 690 176 C 608 232, 515 302, 406 366" fill="none" stroke="#FFF6C2" stroke-width="1.3" opacity="0.75" />

      <!-- Camada 4: Pétalas inferiores largas -->
      <path d="M 125 322 C 202 362, 295 376, 394 370 C 305 335, 212 290, 125 322 Z" fill="url(#goldLeafLight)" />
      <path d="M 125 322 C 218 332, 305 352, 394 370" fill="none" stroke="#FFF6C2" stroke-width="1.2" opacity="0.65" />

      <path d="M 675 322 C 598 362, 505 376, 406 370 C 495 335, 588 290, 675 322 Z" fill="url(#goldLeafLight)" />
      <path d="M 675 322 C 582 332, 495 352, 406 370" fill="none" stroke="#FFF6C2" stroke-width="1.2" opacity="0.65" />

      <!-- Camada 5: Pétalas da base (sépalas curvadas para baixo) -->
      <path d="M 225 402 C 285 415, 345 402, 396 374 C 335 372, 272 378, 225 402 Z" fill="url(#goldLeafDeep)" />
      <path d="M 575 402 C 515 415, 455 402, 404 374 C 465 372, 528 378, 575 402 Z" fill="url(#goldLeafDeep)" />

      <!-- Camada 6: Pétalas frontais internas -->
      <path d="M 248 134 C 230 226, 266 314, 398 366 C 378 265, 336 188, 248 134 Z" fill="url(#goldLeafCenter)" />
      <path d="M 248 134 C 288 216, 332 296, 398 366" fill="none" stroke="#FFF8CC" stroke-width="1.3" opacity="0.65" />

      <path d="M 552 134 C 570 226, 534 314, 402 366 C 422 265, 464 188, 552 134 Z" fill="url(#goldLeafCenter)" />
      <path d="M 552 134 C 512 216, 468 296, 402 366" fill="none" stroke="#FFF8CC" stroke-width="1.3" opacity="0.65" />

      <!-- Camada 7: Pétala central principal com relevo acetinado -->
      <path d="M 400 84 C 314 174, 312 286, 400 368 C 488 286, 486 174, 400 84 Z" fill="url(#goldLeafCenter)" stroke-width="3" />
      <!-- Linhas de brilho acetinado interno -->
      <path d="M 400 94 C 336 180, 335 280, 400 360" fill="none" stroke="#FFFBE0" stroke-width="1.2" opacity="0.75" />
      <path d="M 400 94 C 464 180, 465 280, 400 360" fill="none" stroke="#9A6116" stroke-width="1.1" opacity="0.45" />
      <line x1="400" y1="90" x2="400" y2="365" stroke="#8C5610" stroke-width="1.2" opacity="0.4" />
    </g>

    <!-- ==================== JOIAS E PEDRAS PRECIOSAS ==================== -->
    <g stroke="url(#goldRim)" stroke-width="1.8">
      <!-- Engastes laterais com Rubis -->
      <circle cx="172" cy="342" r="7" fill="url(#goldLeafLight)" />
      <circle cx="172" cy="342" r="4.2" fill="url(#rubyGem)" stroke="none" />

      <circle cx="628" cy="342" r="7" fill="url(#goldLeafLight)" />
      <circle cx="628" cy="342" r="4.2" fill="url(#rubyGem)" stroke="none" />

      <!-- Broche floral logo abaixo do centro da lótus -->
      <!-- Rubi superior -->
      <ellipse cx="400" cy="382" rx="5.5" ry="7" fill="url(#rubyGem)" />
      <!-- Pétalas laterais em Safira -->
      <path d="M 393 391 C 383 388, 378 395, 386 401 C 390 403, 394 397, 393 391 Z" fill="url(#sapphireGem)" />
      <path d="M 407 391 C 417 388, 422 395, 414 401 C 410 403, 406 397, 407 391 Z" fill="url(#sapphireGem)" />
      <!-- Gota central em Safira -->
      <path d="M 400 391 C 394 398, 395 408, 400 413 C 405 408, 406 398, 400 391 Z" fill="url(#sapphireGem)" />

      <!-- Medalhão oval central com Rubi -->
      <ellipse cx="400" cy="434" rx="7.5" ry="10.5" fill="url(#goldLeafLight)" stroke-width="2" />
      <ellipse cx="400" cy="434" rx="4.5" ry="7" fill="url(#rubyGem)" stroke="none" />

      <!-- Pequeno Rubi de transição -->
      <circle cx="400" cy="456" r="4.5" fill="url(#rubyGem)" />
      <circle cx="400" cy="467" r="3.5" fill="url(#goldLeafLight)" />

      <!-- Pingente inferior em Losango Lapidado com Safira -->
      <polygon points="400,476 426,518 400,560 374,518" fill="url(#goldLeafLight)" stroke-width="2.2" />
      <!-- Facetas internas do losango -->
      <polygon points="400,486 418,518 400,550 382,518" fill="url(#goldLeafDeep)" stroke-width="1.2" />
      <line x1="400" y1="476" x2="400" y2="560" stroke="#FFF6C4" stroke-width="1" opacity="0.6" />
      <line x1="374" y1="518" x2="426" y2="518" stroke="#FFF6C4" stroke-width="1" opacity="0.6" />
      <!-- Safira central no losango -->
      <polygon points="400,505 408,518 400,531 392,518" fill="url(#sapphireGem)" stroke-width="1.4" />
      <!-- Ponto de brilho na safira -->
      <circle cx="398" cy="514" r="1.3" fill="#FFFFFF" stroke="none" opacity="0.9" />
    </g>
  </g>
</svg>